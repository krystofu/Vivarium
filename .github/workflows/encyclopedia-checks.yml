name: Encyclopedia checks
on:
  push:
    paths: ['encyclopedia/**', '.github/workflows/encyclopedia-checks.yml']
  pull_request:
    paths: ['encyclopedia/**', '.github/workflows/encyclopedia-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encyclopedia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
